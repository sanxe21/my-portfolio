<style>
:root{color-scheme:light;--bg:#F7F6F3;--surface:#fff;--text:#151515;--muted:#5E5E5E;--accent:#2B59FF;--on-accent:#fff;--border:rgba(0,0,0,.08);--r-card:12px;--r-btn:10px;--r-chip:999px;--s:8px;--pad:16px;--sec:72px;--hd:64px;--fb:Inter,system-ui,sans-serif;--fh:Manrope,system-ui,sans-serif}

:root[data-theme="dark"]{color-scheme:dark;--bg:#0E0E10;--surface:#17171A;--text:#F2F2F2;--muted:#9A9AA0;--accent:#6C8CFF;--on-accent:#0E0E10;--border:rgba(255,255,255,.08)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hd) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/26px var(--fb);hyphens:auto;overflow-wrap:break-word}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:var(--accent)}
ul,ol{margin:0;padding:0;list-style:none}

.wrap{max-width:1200px;margin:0 auto;padding-inline:var(--pad)}
section{padding-block:var(--sec)}
.h2{font-size:30px;line-height:38px;font-weight:700;margin-bottom:calc(var(--s)*5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--r-btn);font:600 16px/1 var(--fb);text-decoration:none;border:1px solid var(--accent);cursor:pointer;transition:transform .2s ease,background .2s ease,translate .35s cubic-bezier(.22,1,.36,1)}
.btn:hover{transform:translateY(-2px)}

.btn-s{background:transparent;color:var(--accent)}
.btn svg{width:20px;height:20px;flex:none}
header.hd{position:sticky;top:0;z-index:50;height:var(--hd);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.hd .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font:700 18px/1 var(--fh);color:var(--text);text-decoration:none;letter-spacing:-.01em}
.burger{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:var(--r-btn);color:var(--text);cursor:pointer}
.burger svg{width:22px;height:22px}
nav ul{display:none;position:absolute;left:0;right:0;top:var(--hd);flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:8px var(--pad) 16px}
nav ul.open{display:flex}
nav a{display:block;padding:12px 0;color:var(--text);text-decoration:none;font-weight:500}
nav a:hover{color:var(--accent)}
.hero{padding-block:72px 56px}
.eyebrow{color:var(--muted);font-weight:500;margin-bottom:16px}
h1{font-size:34px;line-height:40px;font-weight:700;max-width:18em}
.lead{font-size:20px;line-height:30px;color:var(--muted);max-width:36em;margin-top:24px}
.cta{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px}
.grid{display:grid;gap:24px}
.card{background-color:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);transition:transform .2s ease,box-shadow .2s ease}

.svc li{position:relative;padding-left:20px;margin-top:8px;font-size:15px;line-height:22px}
.svc li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.val{padding:28px 24px}
.metric{font:700 40px/48px var(--fh);color:var(--accent);letter-spacing:-.01em}
.val h3{font-size:18px;line-height:26px;margin:12px 0 8px}

.steps{display:grid;gap:32px;position:relative;padding-left:0}
.steps::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:1px;background:color-mix(in srgb,var(--accent) 45%,transparent);transform:scaleY(0);transform-origin:top;transition:transform 1.2s ease}.steps.in::before{transform:none}
.step{position:relative;padding-left:72px}
.num{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:700 18px/1 var(--fh)}
.step h3{font-size:20px;line-height:28px;margin-bottom:8px}
.step p{color:var(--muted);font-size:15px;line-height:23px}
.hero-g{display:grid;gap:40px;align-items:center}
.photo{width:100%;aspect-ratio:4/5;border-radius:var(--r-card);background:linear-gradient(160deg,var(--accent),hsl(280 70% 60%));display:grid;place-items:center;color:#fff}

.about{display:grid;gap:40px;align-items:center}
.ava{overflow:hidden;width:240px;height:240px;border-radius:50%;background:linear-gradient(135deg,var(--accent),hsl(280 70% 60%));display:grid;place-items:center;color:#fff;margin-inline:auto}

.ct{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:32px}
.big{min-height:56px;font-size:18px}
.links{display:flex;flex-direction:column;gap:12px;margin-top:32px}
.links a{font-weight:500}
footer{border-top:1px solid var(--border);padding-block:32px;color:var(--muted);font-size:14px}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;z-index:40;transition:transform .2s ease,translate .35s cubic-bezier(.22,1,.36,1)}

.rv{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
.bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;z-index:60;pointer-events:none}
.logo{display:flex;align-items:center;color:var(--text)}
.wm{display:block;width:auto;height:30px;overflow:visible}
.wm .d{stroke-dasharray:1;animation:draw .8s ease both;animation-delay:calc(var(--i)*.1s)}
.wm .ac{stroke:var(--accent)}
.wm .dot{fill:var(--accent);stroke:none;transform-box:fill-box;transform-origin:center;animation:pop .4s ease .9s both}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
nav a[aria-current]{color:var(--accent)}
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at var(--gx,75%) var(--gy,25%),color-mix(in srgb,var(--accent) 14%,transparent),transparent 65%);pointer-events:none}
.hero .wrap{position:relative}
.gl{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;opacity:0;transition:opacity 1.6s ease}
.gl.on{opacity:1}
.pw{position:relative;width:100%;max-width:320px}
.photo{transition:transform .2s ease-out;will-change:transform}
.mq{border-block:1px solid var(--border);overflow:hidden;padding-block:20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-t{display:flex;width:max-content;align-items:center;gap:32px;padding-right:32px;animation:mq 70s linear infinite}
.mq:hover .mq-t{animation-play-state:paused}
.mq-t span{font:700 clamp(28px,5vw,56px)/1.1 var(--fh);letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1px var(--muted);white-space:nowrap}
.mq-t span:nth-of-type(even){color:var(--text);-webkit-text-stroke:0}
.mq-t i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
main{counter-reset:sec}
.h2{counter-increment:sec}
.h2::before{content:counter(sec,decimal-leading-zero);content:counter(sec,decimal-leading-zero) / "";display:block;margin-bottom:12px;font:600 13px/1 var(--fb);letter-spacing:.16em;color:var(--accent)}
.rv.split{opacity:1;transform:none}
.split::before{opacity:0;transition:opacity .9s ease .1s}
.split.in::before{opacity:1}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
.split .wi{display:inline-block;transform:translateY(112%);transition:transform 1.1s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--i)*70ms + 120ms)}
.split.in .wi{transform:none}
.card.rv.done{transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease}
.hero{isolation:isolate}
.aur{position:absolute;z-index:-1;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:.6;will-change:transform;animation:aur 26s ease-in-out infinite alternate}
.aur.a{width:min(520px,70vw);aspect-ratio:1;left:-8%;top:-10%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 36%,transparent),transparent 68%)}
.aur.b{width:min(460px,60vw);aspect-ratio:1;right:-6%;bottom:-18%;background:radial-gradient(circle,hsl(280 70% 60% / .28),transparent 68%);animation-duration:34s;animation-direction:alternate-reverse}
@keyframes aur{to{transform:translate(8%,10%) scale(1.15)}}
.eyebrow,.lead,.cta{animation:up 1s cubic-bezier(.22,1,.36,1) both}
.eyebrow{animation-delay:.1s}.lead{animation-delay:.75s}.cta{animation-delay:.95s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.photo{clip-path:inset(100% 0 0 0);animation:curt 1.6s cubic-bezier(.77,0,.18,1) .25s forwards}
@keyframes curt{to{clip-path:inset(0)}}
.photo img{animation:zin 2.6s cubic-bezier(.22,1,.36,1) .25s both}
@keyframes zin{from{transform:scale(1.2)}}
.about .ava{clip-path:circle(0% at 50% 50%);transition:clip-path 1.5s cubic-bezier(.77,0,.18,1) .2s}
.about.in .ava{clip-path:circle(72% at 50% 50%)}
.about .ava img{transform:scale(1.2);transition:transform 2.2s cubic-bezier(.22,1,.36,1) .2s}
.about.in .ava img{transform:none}
.fwm{padding-bottom:40px;color:var(--text)}
.fwm .wm{width:100%;max-width:760px;height:auto;opacity:.16}
.fwm .d,.fwm .dot{animation-play-state:paused}
.fwm.in .d,.fwm.in .dot{animation-play-state:running}
.fwm .d{animation-duration:1.6s}
.hr{display:flex;align-items:center;gap:8px}
.theme{order:-1;display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:var(--r-btn);color:var(--text);cursor:pointer;transition:background .2s ease,color .2s ease}
.theme:hover{color:var(--accent)}
.theme svg{width:20px;height:20px}
.theme .sun{display:none}.theme.is-dark .sun{display:block}.theme.is-dark .moon{display:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
body::after{content:"";position:fixed;inset:0;z-index:150;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.sh{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block;opacity:0;transition:opacity 2s ease}
.sh.on{opacity:1}
.shader-on .aur{display:none}
#contact{position:relative;isolation:isolate;overflow:hidden}
.cur,.cur-d{position:fixed;left:0;top:0;pointer-events:none;z-index:200;opacity:0;transition:opacity .3s ease}
.cur.on,.cur-d.on{opacity:1}
.cur-i{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 65%,transparent);transition:transform .45s cubic-bezier(.22,1,.36,1),background-color .3s ease,border-color .3s ease}
.cur.hov .cur-i{transform:scale(1.5);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cur.lbl .cur-i{transform:scale(2.5);background:var(--accent);border-color:var(--accent)}
.cur-t{position:absolute;left:0;top:0;translate:-50% -50%;font:600 12px/1 var(--fb);color:var(--on-accent);white-space:nowrap;opacity:0;transition:opacity .25s ease}
.cur.lbl .cur-t{opacity:1}
.cur-d::before{content:"";position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent);transition:transform .25s ease}
.cur-d.off::before{transform:scale(0)}
@media(min-width:640px){:root{--pad:24px}.grid.c2,.grid.c4{grid-template-columns:repeat(2,1fr)}.links{flex-direction:row;gap:32px}}
@media(min-width:760px){:root{--sec:112px}.burger{display:none}.theme{order:0;margin-left:8px;width:40px;height:40px}nav ul{display:flex;position:static;flex-direction:row;gap:24px;background:none;border:0;padding:0}nav a{padding:8px 0;font-size:15px;white-space:nowrap}.btn{white-space:nowrap}.hero{padding-block:112px 80px}h1{font-size:52px;line-height:58px}.h2{font-size:38px;line-height:46px}.about{grid-template-columns:240px 1fr;gap:64px}.ava{margin:0}}
@media(min-width:1024px){.hero-g{grid-template-columns:1fr 360px;gap:64px}.pw{max-width:none}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.steps{grid-template-columns:repeat(4,1fr);gap:24px}.steps::before{left:24px;right:24px;top:24px;bottom:auto;width:auto;height:1px;transform:scaleX(0);transform-origin:left}.steps.in::before{transform:none}.step{padding:72px 0 0}}
@media(min-width:640px) and (max-width:1023px){.grid.c3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1023px){.svc-g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}.rv{opacity:1;transform:none}.card:hover,.btn:hover,.fab:hover{transform:none}.mq-t,.wm .d,.wm .dot{animation:none}.wm .dot{opacity:1}.steps::before{transform:none!important}.bar{transition:none}.sh{transition:none}.photo{clip-path:none;animation:none}.photo img,.eyebrow,.lead,.cta,.aur{animation:none}.about .ava{clip-path:none}.about .ava img{transform:none}.split .wi{transform:none}}
</style>

(function(){

<script type="module">
